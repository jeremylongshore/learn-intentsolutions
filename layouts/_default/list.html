{{ define "main" }}
<article class="prose">
  <p class="breadcrumb"><a href="/">Learn</a> / {{ .Title }}</p>

  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="page-lede">{{ . }}</p>{{ end }}
  </header>

  {{ .Content }}

  {{ if .Pages }}
    <ul class="note-list">
      {{ range .Pages.ByWeight }}
        <li>
          <a href="{{ .RelPermalink }}">
            <span class="note-title">{{ .Title }}</span>
            {{ with .Description }}<span class="note-desc">{{ . }}</span>{{ end }}
          </a>
        </li>
      {{ end }}
    </ul>
  {{ end }}
</article>
{{ end }}
