{{ define "main" }}
<article class="prose">
  <header class="page-header">
    <h1>Learn.</h1>
    <p class="page-lede">{{ .Site.Params.description }}</p>
  </header>

  {{ .Content }}

  <ul class="topic-list">
    {{ range where .Site.Sections "Section" "!=" "" }}
      <li>
        <a href="{{ .RelPermalink }}">
          <span class="topic-title">{{ .Title }}</span>
          {{ with .Description }}<span class="topic-desc">{{ . }}</span>{{ end }}
          <span class="topic-count">{{ len .Pages }} note{{ if ne (len .Pages) 1 }}s{{ end }}</span>
        </a>
      </li>
    {{ end }}
  </ul>
</article>
{{ end }}
